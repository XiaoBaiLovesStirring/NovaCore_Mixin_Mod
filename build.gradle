buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://files.minecraftforge.net/maven" }
        maven { name = "sponge"; url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
        classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle"
apply plugin: "org.spongepowered.mixin"
apply plugin: "java"

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

dependencies {
    implementation "org.spongepowered:mixin:0.8.5"
}

mixin {
    add sourceSets.main, "novacore.mixin-refmap.json"
}

jar {
    baseName = "novacore-mixin"
    manifest {
        attributes(
            "MixinConfigs": "mixins.novacore.json"
        )
    }
}

task agentJar(type: Jar) {
    baseName = "novacore-agent"
    from(sourceSets.main.output) {
        include "com/novacore/agent/**"
    }
    manifest {
        attributes(
            "Premain-Class": "com.novacore.agent.NovaAgent",
            "Can-Redefine-Classes": "true",
            "Can-Retransform-Classes": "true"
        )
    }
}

assemble.dependsOn(agentJar)

compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
    options.encoding = "UTF-8"
}
